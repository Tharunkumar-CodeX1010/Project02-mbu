[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "moviescope"
version = "1.0.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "Flask>=3.1,<4.0",
    "psycopg[binary]>=3.2,<4.0",
    "python-dotenv>=1.0,<2.0",
    "pandas>=2.2,<4.0",
    "numpy>=2.0,<3.0",
    "matplotlib>=3.9,<4.0",
    "scikit-learn>=1.5,<2.0",
]

[tool.setuptools]
py-modules = ["config", "index", "run"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.vercel]
entrypoint = "index:app"

[tool.vercel.scripts]
build = "python scripts/prepare_vercel.py"
